[project]
name = "refundpilot-api"
version = "0.1.0"
description = "RefundPilot backend: AI evidence assessment, deterministic refund policy, PayPal refund execution."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "pillow>=10.0",
    "python-multipart>=0.0.9",
    "google-genai>=2.34,<3",  # primary AI provider; 3.x changed the default API version
    "openai>=1.50",           # optional backup provider (only used when OPENAI_API_KEY is set)
]

[project.optional-dependencies]
gemini = []                   # kept so existing `pip install -e ".[gemini]"` commands still work
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
