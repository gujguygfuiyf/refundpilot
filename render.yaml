services:
  - type: web
    name: refundpilot-api
    runtime: python
    rootDir: backend
    plan: starter
    buildCommand: pip install -e ".[postgres,gemini]"
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: refundpilot-db
          property: connectionString
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-flash-latest
      # Optional OpenAI backup: add OPENAI_API_KEY (and OPENAI_MODEL) in the dashboard if you want one.
      - key: MERCHANT_TOKEN          # random; the web service copies it so judges skip sign-in
        generateValue: true
      - key: DEV_TOKEN               # random and private; only for POST /dev/seed
        generateValue: true
      - key: CORS_ORIGINS
        value: https://refundpilot-web.onrender.com
  - type: web
    name: refundpilot-web
    runtime: node
    rootDir: frontend
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://refundpilot-api.onrender.com
      - key: NEXT_PUBLIC_DEMO_MERCHANT_TOKEN   # baked into the public bundle on purpose (sandbox-only demo)
        fromService:
          type: web
          name: refundpilot-api
          envVarKey: MERCHANT_TOKEN
databases:
  - name: refundpilot-db
    plan: basic-256mb   # free Postgres expires after 30 days; judging runs to mid-December
