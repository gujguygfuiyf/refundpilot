services:
  - type: web
    name: refundpilot-api
    runtime: python
    rootDir: backend
    plan: starter
    buildCommand: pip install -e ".[postgres,gemini]"
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: refundpilot-db
          property: connectionString
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5
      - key: GEMINI_API_KEY
        sync: false
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-flash-latest
      - key: MERCHANT_TOKEN
        sync: false
      - key: DEV_TOKEN
        sync: false
      - key: CORS_ORIGINS
        value: https://refundpilot-web.onrender.com
  - type: web
    name: refundpilot-web
    runtime: node
    rootDir: frontend
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://refundpilot-api.onrender.com
      - key: NEXT_PUBLIC_DEMO_MERCHANT_TOKEN   # baked into the public bundle on purpose: judges skip sign-in
        sync: false
databases:
  - name: refundpilot-db
    plan: basic-256mb   # free Postgres expires after 30 days; judging runs to mid-December
